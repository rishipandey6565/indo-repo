  name: Daily Pipeline

on:
  schedule:
    - cron: '10 17 * * *'  # 5:10 PM UTC = 12:10 AM WIB
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — EPG Scraper
  # ─────────────────────────────────────────
  epg-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EPG scraper
        run: python epg_scraper.py

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          TIMESTAMP=$(TZ='Asia/Jakarta' date '+%Y-%m-%d %H:%M:%S WIB')
          git commit -m "Update EPG schedules - ${TIMESTAMP}"
          git push

      - name: Upload scrape log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log
          path: scrape.log
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2 — Download Logos
  # ─────────────────────────────────────────
  download-logos:
    runs-on: ubuntu-latest
    needs: epg-scraper
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Pull latest before running script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main   # ← clean tree here, so this always works

      - name: Run Logo Downloader
        run: python scripts/download_logos.py

      - name: Commit and push changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto download logos and update JSON"
            git push
          fi

  # ─────────────────────────────────────────
  # JOB 3 — Upload to Cloudflare R2
  # ─────────────────────────────────────────
  upload-r2:
    runs-on: ubuntu-latest
    needs: download-logos  # waits for Job 2 to finish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main        # picks up any commits from Jobs 1 & 2

      - name: Install rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [indo]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_INDO_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_INDO_SECRET_ACCESS_KEY }}
          endpoint = https://${{ secrets.R2_INDO_ACCOUNT_ID }}.r2.cloudflarestorage.com
          EOF

      - name: Sync images to R2
        run: |
          rclone sync downloaded-images indo:${{ secrets.R2_INDO_BUCKET_NAME }}/wp-content/uploads/downloaded-images \
            --transfers=64 \
            --checkers=64 \
            --fast-list \
            --size-only \
            --delete-during

      - name: Sync schedule JSON to R2
        run: |
          rclone sync schedule indo:${{ secrets.R2_INDO_BUCKET_NAME }}/schedule \
            --transfers=32 \
            --checkers=32 \
            --fast-list \
            --size-only \
            --delete-during

      - name: Purge Cloudflare Cache
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
